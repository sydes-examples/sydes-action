name: Sydes verify (reusable)

# Central, versionable implementation of the Sydes PR-verification integration.
# Individual example repositories call this instead of each carrying their own
# copy of the workflow steps and renderer script. See ../../CONTRACT.md in
# this repository for the frozen v1 artifact/presentation contract this
# workflow implements.
#
# Called from a repository's own `pull_request`-triggered workflow, e.g.:
#
#   jobs:
#     sydes:
#       uses: sydes-examples/sydes-action/.github/workflows/verify.yml@v1
#       with:
#         repo_alias: app
#       secrets:
#         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
#
# The caller keeps its own `on: pull_request` trigger, permissions, and
# concurrency group; this workflow inherits the same `github.event` context
# because reusable-workflow jobs run within the caller's workflow run.
#
# VERSION CONSISTENCY: GitHub Actions gives a reusable workflow no way to
# introspect the ref it was itself invoked at (no `github.*` context exposes
# this), so `renderer_ref`'s default below cannot be computed at run time --
# it is a literal string, kept in sync with this file's own release tag by
# hand. Concretely: this file's `renderer_ref` default is "v1" because this
# exact commit IS what the `v1` tag points at. Cutting a future `v2` means
# bumping this default to "v2" in that same release commit, before moving
# the tag -- otherwise a consumer pinning `@v2` would still silently pull
# the `v1` renderer (or whatever "main" drifted to, if this were ever
# pointed back at "main"). This is what keeps `uses: .../verify.yml@v1`
# meaning "the whole v1 integration, workflow AND renderer" rather than
# "the v1 workflow, with a renderer that can drift out from under it".

on:
  workflow_call:
    inputs:
      model:
        description: Model spec passed to `sydes verify-change --model`.
        type: string
        default: "openai:gpt-4.1-mini"
      repo_alias:
        description: Name Sydes uses for the checked-out repo (`--repo <alias>=.`).
        type: string
        default: "app"
      sydes_ref:
        description: >-
          Exact `sydes` PyPI version to pin (passed to `pip install
          sydes==<value>`), e.g. "0.2.1". Leave unset (the default) for
          the normal, public install contract: `pip install --upgrade
          sydes`, the same command any user runs, always resolving to
          the newest stable release. Only set this for benchmark/research
          reproducibility, where a specific version needs to be recorded
          and pinned deliberately.
        type: string
        default: ""
      renderer_ref:
        description: >-
          Git ref of this repository to pull the renderer script from.
          Defaults to this workflow's own release tag (see the module-level
          comment above), never "main" -- a consumer pinning `@v1` gets the
          v1 renderer too, not whatever the tip of main happens to be at
          run time. Override only for the same deliberate-pinning use case
          `sydes_ref` documents above (e.g. testing an unreleased renderer
          change); most callers should never set this.
        type: string
        default: "v1"
      recovery_route_context:
        description: >-
          Pass `--recovery-route-context` to `sydes verify-change` (see
          that flag's own help for what it does). Off by default —
          existing callers see no behavior change.
        type: boolean
        default: false
      recovery_graph_path_search:
        description: >-
          Pass `--recovery-graph-path-search` to `sydes verify-change`
          (see that flag's own help for what it does). Off by default —
          existing callers see no behavior change.
        type: boolean
        default: false
      run_tests:
        description: >-
          When true, omit `--no-run-tests` so `sydes verify-change`
          actually executes the repository's relevant test(s) (or, when
          none of the mapped tests can be invoked individually, the whole
          detected test command) and attributes pass/fail per obligation.
          Off by default — existing callers see no behavior change; the
          checked-out repository must already be able to install/run its
          own test suite in this job's environment.
        type: boolean
        default: false
      node_version:
        description: >-
          Node.js version for `actions/setup-node`, only used when
          `run_tests` is true and the repository has a package.json. A
          caller whose native dependencies predate modern Node/V8 (e.g. an
          old `bcrypt`/`nan` build) can pin an older runtime here instead
          of the default.
        type: string
        default: "20"
      mutation_verify:
        description: >-
          Pass `--mutation-verify` to `sydes verify-change` (see that
          flag's own help for what it does) -- for a validation obligation
          this run introduced and already resolved as passed, flips a
          `>`/`>=`/`</`<=` inside the diff's own hunks, reruns that
          obligation's own mapped test against the mutation, and reports
          whether it still passed (a possible coverage gap at that exact
          boundary) or failed (the test protects it). Off by default, and
          only meaningful when `run_tests` is also true -- it needs to
          execute a test to mean anything.
        type: boolean
        default: false
      sydes_git_ref:
        description: >-
          Install Sydes from github.com/sydes-ai/sydes at this ref (branch,
          tag or commit) with its own uv.lock (`uv sync --frozen`), instead
          of from PyPI. For validating an unreleased integration branch;
          takes precedence over `sydes_ref`. Empty (default): PyPI install.
        type: string
        default: ""
      runner:
        description: >-
          Runner label. DiffGenome only executes target tests under an OS
          sandbox it supports (macOS `sandbox-exec` in 0.1.0), so runtime
          evidence needs a macOS runner (e.g. "macos-15"); on Linux it
          refuses to run and the comment says so.
        type: string
        default: "ubuntu-24.04"
      runtime_evidence_args:
        description: >-
          DiffGenome runtime configuration (forwarded to `diffgenome change`
          via `--behavioral-args`), e.g. "--runtime go --test-root api
          --tests ./api/". When set, Sydes runs with `--behavioral-map
          diffgenome --runtime-evidence auto`: the repository's existing
          tests run against the change and the observed facts feed
          reachability, test mapping, verification gaps and AI recovery.
          Empty (default): no runtime evidence; existing callers see no
          behavior change.
        type: string
        default: ""
      runtime_setup:
        description: >-
          Shell commands run before analysis when `runtime_evidence_args`
          is set: whatever the repository's tests need (services, a
          virtualenv). Runs in the checked-out repository.
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        description: OpenAI key for `sydes verify-change`'s LLM calls.
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-change:
    name: Sydes verify-change
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    # workflow_call jobs run inside the caller's workflow run, so this groups
    # correctly per-PR even though the group name is defined here.
    concurrency:
      group: sydes-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      # Full history: Sydes resolves the change with `git merge-base <base> HEAD`,
      # so both the PR head and the PR base commit must be present locally.
      - name: Check out PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Only when a caller actually asked to execute tests (`run_tests`,
      # default off) -- installing a Node toolchain/dependencies for every
      # analysis-only run would be pure overhead, and most callers never
      # need it. Generic across any Node repo, not this one specifically:
      # `--legacy-peer-deps` is a common, non-repo-specific npm
      # compatibility flag for older dependency trees, not an Express- or
      # routing-controllers-specific accommodation.
      - name: Set up Node
        if: inputs.run_tests && hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install repository dependencies
        if: inputs.run_tests && hashFiles('package.json') != ''
        run: npm install --legacy-peer-deps

      # Generic across any Python repo, not this one specifically: tries the
      # project's own declared install path(s) first, each defensively
      # allowed to fail (a repo need not define all of them), then falls
      # back to installing pytest directly as a last resort so the test
      # *runner* is at least present even if a project's own test-dependency
      # declaration doesn't match any of the conventional shapes tried here.
      # Without this, `run_tests`/`mutation_verify` on a Python repo whose
      # test dependencies are declared as optional/dev extras (a common,
      # unremarkable pattern) fails at the first test invocation with "No
      # module named pytest" -- the repository's own package was never
      # installed at all.
      - name: Install Python repository dependencies
        if: inputs.run_tests && hashFiles('pyproject.toml', 'setup.py', 'requirements*.txt') != ''
        run: |
          set +e
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e ".[dev]" 2>/dev/null \
              || pip install -e ".[test]" 2>/dev/null \
              || pip install -e . 2>/dev/null
          fi
          for req in requirements.txt requirements-dev.txt requirements-test.txt dev-requirements.txt; do
            [ -f "$req" ] && pip install -r "$req"
          done
          python -m pytest --version >/dev/null 2>&1 || pip install pytest
          set -e

      - name: Set up uv
        if: inputs.sydes_git_ref != ''
        uses: astral-sh/setup-uv@v6

      # Checked out under RUNNER_TEMP, outside the tree Sydes analyzes (see the
      # renderer checkout below for why that matters).
      - name: Install Sydes from git (locked)
        if: inputs.sydes_git_ref != ''
        env:
          SYDES_GIT_REF: ${{ inputs.sydes_git_ref }}
        run: |
          git clone -q https://github.com/sydes-ai/sydes "$RUNNER_TEMP/sydes"
          git -C "$RUNNER_TEMP/sydes" checkout -q "$SYDES_GIT_REF"
          (cd "$RUNNER_TEMP/sydes" && uv sync --frozen --no-dev --python "$(command -v python)")
          echo "$RUNNER_TEMP/sydes/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Sydes
        if: inputs.sydes_git_ref == ''
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ inputs.sydes_ref }}" ]; then
            python -m pip install "sydes==${{ inputs.sydes_ref }}"
          else
            python -m pip install --upgrade sydes
          fi
          sydes --version

      # DiffGenome runs `go test` offline inside its sandbox: the toolchain and
      # the module cache must be in place first.
      - name: Set up Go (runtime evidence)
        if: inputs.runtime_evidence_args != '' && hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Go modules (runtime evidence)
        if: inputs.runtime_evidence_args != '' && hashFiles('go.mod') != ''
        run: go mod download

      - name: Prepare test environment (runtime evidence)
        if: inputs.runtime_evidence_args != '' && inputs.runtime_setup != ''
        run: ${{ inputs.runtime_setup }}

      # What actually ran: recorded in the job summary and the uploaded artifact,
      # so a reviewer can tell the published DiffGenome package was used.
      - name: Record provenance
        env:
          SYDES_GIT_REF: ${{ inputs.sydes_git_ref }}
        run: |
          SYDES_PY="$(dirname "$(command -v sydes)")/python"
          {
            echo "### Sydes run provenance"
            echo '```text'
            echo "runner:            $RUNNER_OS $RUNNER_ARCH ($ImageOS $ImageVersion)"
            echo "python:            $("$SYDES_PY" -V 2>&1)"
            echo "sydes:             $(sydes --version 2>&1 | head -1)"
            if [ -n "$SYDES_GIT_REF" ]; then
              echo "sydes git ref:     $SYDES_GIT_REF"
              echo "sydes commit:      $(git -C "$RUNNER_TEMP/sydes" rev-parse HEAD)"
            fi
            "$SYDES_PY" - <<'PY' || echo "diffgenome:        not installed"
          import importlib.metadata as md, json, pathlib, diffgenome
          dist = md.distribution("diffgenome")
          direct = dist.read_text("direct_url.json")
          print(f"diffgenome:        {dist.version} (import: {pathlib.Path(diffgenome.__file__).parent})")
          print(f"diffgenome source: {json.loads(direct)['url'] if direct else 'package index (no direct/local URL)'}")
          print(f"diffgenome installer: {(dist.read_text('INSTALLER') or '?').strip()}")
          PY
            echo "diffgenome cli:    $(command -v diffgenome) -> $(diffgenome --version 2>&1)"
            if [ -n "$SYDES_GIT_REF" ]; then
              echo "uv.lock entry:"
              grep -A3 '^name = "diffgenome"' "$RUNNER_TEMP/sydes/uv.lock" | grep -E 'version|source' | sed 's/^/  /'
              grep -A12 '^name = "diffgenome"' "$RUNNER_TEMP/sydes/uv.lock" | grep -o 'https://files.pythonhosted.org[^"]*\.whl' | sed 's/^/  /'
            fi
            echo '```'
          } | tee sydes-provenance.md >> "$GITHUB_STEP_SUMMARY"
          cat sydes-provenance.md

      - name: Run Sydes verify-change
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The impact guide requires the Codebase Memory backend; the default
          # backend is `native`, which would silently skip semantic inference.
          SYDES_CODE_INTELLIGENCE: cbm
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO_ALIAS: ${{ inputs.repo_alias }}
          MODEL: ${{ inputs.model }}
          RUNTIME_EVIDENCE_ARGS: ${{ inputs.runtime_evidence_args }}
        run: |
          EXTRA_FLAGS=()
          if [ "${{ inputs.recovery_route_context }}" = "true" ]; then
            EXTRA_FLAGS+=(--recovery-route-context)
          fi
          if [ "${{ inputs.recovery_graph_path_search }}" = "true" ]; then
            EXTRA_FLAGS+=(--recovery-graph-path-search)
          fi
          if [ "${{ inputs.run_tests }}" != "true" ]; then
            EXTRA_FLAGS+=(--no-run-tests)
          fi
          if [ "${{ inputs.mutation_verify }}" = "true" ]; then
            EXTRA_FLAGS+=(--mutation-verify)
          fi
          if [ -n "$RUNTIME_EVIDENCE_ARGS" ]; then
            EXTRA_FLAGS+=(--behavioral-map diffgenome --behavioral-args "$RUNTIME_EVIDENCE_ARGS"
                          --behavioral-out "$RUNNER_TEMP/diffgenome" --runtime-evidence auto)
          fi
          CMD=(sydes verify-change
            --base "$BASE_SHA"
            --repo "${REPO_ALIAS}=."
            --llm-policy auto
            --impact-guide auto
            --code-review
            --model "$MODEL"
            --verbose
            "${EXTRA_FLAGS[@]}"
            --json sydes-result.json)
          { echo; echo "command: $(printf '%q ' "${CMD[@]}")"; } | tee -a sydes-provenance.md
          START=$(date +%s)
          set +e
          "${CMD[@]}"
          STATUS=$?
          set -e
          echo "wall time: $(( $(date +%s) - START ))s, exit $STATUS" | tee -a sydes-provenance.md
          exit $STATUS

      # A separate, pinned checkout of the renderer — it lives here, not in
      # the repository under test. Deliberately checked out AFTER "Run Sydes
      # verify-change", not before: this directory used to be checked out
      # first, directly inside the same working tree `--repo app=.` points
      # Sydes at, and Sydes correctly scoped its scan to that whole tree --
      # including this directory. On a real PR that put one of this
      # checkout's own test files (`_sydes-integration/scripts/tests/
      # test_render_sydes_pr.py`) in front of Sydes' test-mapping pass, which
      # matched it as "evidence" for an app route purely because a string in
      # one of its fixtures happened to overlap the route's path -- a false,
      # cross-repository attribution with nothing to do with the PR under
      # test. Checking this out only once analysis is already done removes
      # it from the tree Sydes ever sees, with no change to Sydes itself.
      - name: Check out Sydes integration scripts
        if: always()
        uses: actions/checkout@v5
        with:
          repository: sydes-examples/sydes-action
          ref: ${{ inputs.renderer_ref }}
          path: _sydes-integration
          sparse-checkout: |
            scripts

      # Rendering runs even when the analysis step failed, so the PR still
      # gets an explanation instead of silence.
      - name: Render Sydes summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python _sydes-integration/scripts/render_sydes_pr.py sydes-result.json \
            --out sydes-comment.md \
            --diagnostics-out sydes-diagnostics.json \
            --run-url "$RUN_URL"
          cat sydes-comment.md >> "$GITHUB_STEP_SUMMARY"
          echo "Wrote $(wc -c < sydes-comment.md) bytes to the job summary."

      - name: Post or update Sydes PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sydes-verification-comment -->';
            const body = fs.readFileSync('sydes-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body },
              );
              core.info(`Updated Sydes comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment(
                { owner, repo, issue_number, body },
              );
              core.info(`Created Sydes comment ${created.data.id}`);
            }

      - name: Upload Sydes result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sydes-result
          # sydes-result.ai_recovery.json only exists when AI recovery
          # actually ran and the CLI wrote its sidecar (--json's stem +
          # .ai_recovery.json) -- if-no-files-found: warn means its
          # absence (recovery off, not triggered, or unresolved) never
          # fails this step, it just isn't in the artifact that run.
          path: |
            sydes-result.json
            sydes-result.ai_recovery.json
            sydes-comment.md
            sydes-diagnostics.json
            sydes-provenance.md
            ${{ runner.temp }}/diffgenome/diffgenome-change.json
          if-no-files-found: warn
